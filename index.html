<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="The Unfolding — a psychedelic space opera by S. Nyland. Read the first chapters free online, with character narration, wiki, and interactive map." />
<!-- Open Graph / Social preview -->
<meta property="og:type"        content="website"/>
<meta property="og:title"       content="The Unfolding"/>
<meta property="og:description" content="A psychedelic space opera by S. Nyland."/>
<meta property="og:image"       content="https://the-unfolding.net/meta/releasefriday.jpg"/>
<meta property="og:image:width" content="1500"/>
<meta property="og:image:height" content="500"/>
<meta property="og:url"         content="https://the-unfolding.net"/>

<title>The Unfolding — a novel by S. Nyland</title>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="favicon-180.png"/>

<!-- Preconnect for fonts and CDN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>

<!-- Google Fonts: load async via media trick to avoid render-blocking -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap"
      media="print" onload="this.media='all'"/>
<noscript>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap"/>
</noscript>

<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/fold-gate.css" />

<!-- Critical inline style: prevent FOUT and CLS while fonts/JS load -->
<style>
  body { font-family: Georgia, serif; }
  .grain::before { opacity: 0.08; }
  #root { min-height: 100vh; }
</style>

<!-- React 18 production builds — synchronous so JSX components can reference
     React/ReactDOM immediately when Babel processes them after defer fires. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<!-- Babel standalone: deferred so it doesn't block first paint.
     React is already on window by the time defer scripts execute. -->
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        defer
        crossorigin="anonymous"></script>

<!-- Supabase: only needed for fold-gate / auth after interaction -->
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
        defer
        crossorigin="anonymous"></script>
</head>
<body class="grain" id="top">
  <div id="root"></div>

  <script type="text/babel" src="src/Nav.jsx" defer></script>
  <script type="text/babel" src="src/Hero.jsx" defer></script>
  <script type="text/babel" src="src/Synopsis.jsx" defer></script>
  <script type="text/babel" src="src/Excerpt.jsx" defer></script>
  <script type="text/babel" src="src/Reviews.jsx" defer></script>
  <script type="text/babel" src="src/JoinFold.jsx" defer></script>
  <script type="text/babel" src="src/Buy.jsx" defer></script>
  <script type="text/babel" src="src/CodexInvite.jsx" defer></script>
  <script type="text/babel" src="src/Portal.jsx" defer></script>
  <script type="text/babel" src="src/Author.jsx" defer></script>

  <script type="text/babel" data-presets="env,react" defer>
    const { useState, useEffect } = React;

    const ACCENTS = {
      rose:    { main: '#e94a7c', deep: '#c72f63', soft: '#f39bb4' },
      teal:    { main: '#3b7682', deep: '#255761', soft: '#88c3cd' },
      saffron: { main: '#f4ce74', deep: '#d8a738', soft: '#fbe4b2' },
      violet:  { main: '#c4a6ff', deep: '#9b7ae0', soft: '#e3d1ff' },
    };
    const FONTS = {
      cormorant: "'Cormorant Garamond', Georgia, serif",
      playfair:  "'Playfair Display', Georgia, serif",
      spectral:  "'Spectral', Georgia, serif",
    };

    function App() {
      const [tweaksOn, setTweaksOn] = useState(false);
      const [values, setValues] = useState(window.TWEAK_DEFAULTS);

      useEffect(() => {
        function onMsg(e) {
          const d = e.data;
          if (!d || !d.type) return;
          if (d.type === '__activate_edit_mode') setTweaksOn(true);
          if (d.type === '__deactivate_edit_mode') setTweaksOn(false);
        }
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      useEffect(() => {
        const a = ACCENTS[values.accent] || ACCENTS.rose;
        const r = document.documentElement;
        r.style.setProperty('--rose', a.main);
        r.style.setProperty('--rose-deep', a.deep);
        r.style.setProperty('--rose-soft', a.soft);
        r.style.setProperty('--serif', FONTS[values.serifFont] || FONTS.cormorant);
        const grainOpacity = (values.grainIntensity || 8) / 100;
        let s = document.getElementById('grain-intensity-style');
        if (!s) { s = document.createElement('style'); s.id = 'grain-intensity-style'; document.head.appendChild(s); }
        s.textContent = `.grain::before { opacity: ${grainOpacity} !important; }`;
      }, [values]);

      function update(edits) {
        setValues(v => {
          const nv = { ...v, ...edits };
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: nv }, '*');
          return nv;
        });
      }

      const onBuy = () => { document.getElementById('buy')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

      return (
        <>
          <Nav />
          <Hero onBuy={onBuy} />
          <Synopsis />
          <Excerpt />
          <JoinFold />
          <Buy />
          <CodexInvite />
          <Author />
          <SiteFooter />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

<!-- Analytics and fold-gate: non-critical, always deferred -->
<script src="js/analytics.js" defer></script>
<script src="js/fold-gate.js" defer></script>
</body>
</html>
